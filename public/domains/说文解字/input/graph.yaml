      remove/to untie/to loosen/to open/to emancipate/to explain/to understand/to
      know/a solution/a dissection / to transport under guard
    tier: 1
    label: 解
    composed_of:
    - 刀
    - 牛
    - 角
  字:
    symbol: zi4
    defines: letter/symbol/character/word/CL:個|个[ge4]/courtesy or style name traditionally
      given to males aged 20 in dynastic China
    tier: 1
    label: 字
    composed_of:
    - 子
    - 宀
applications:
  phrase_说文解字:
