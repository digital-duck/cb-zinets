domain: 说文解字
primitives:
  讠:
    symbol: yan2
    defines: '"""speech"" or ""words"" radical in Chinese characters (Kangxi radical
      149)/see also 言字旁[yan2 zi4 pang2]"  to satisfy'
    tier: 0
    label: 讠
  丷:
    symbol: ba1
    defines: '"""eight"" component in Chinese characters/archaic variant of 八[ba1]"'
    tier: 0
    label: 丷
  儿:
    symbol: er2
    defines: child/son
    tier: 0
    label: 儿
  口:
    symbol: kou3
    defines: mouth/classifier for things with mouths (people, domestic animals, cannons,
      wells etc)/classifier for bites or mouthfuls
    tier: 0
    label: 口
  亠:
    symbol: tou2
    defines: '"""lid"" radical in Chinese characters (Kangxi radical 8)"'
    tier: 0
    label: 亠
  丿:
    symbol: pie3
    defines: radical in Chinese characters (Kangxi radical 4), aka 撇[pie3]
    tier: 0
    label: 丿
  乀:
    symbol: na4
    defines: line
    tier: 0
    label: 乀
  刀:
    symbol: dao1
    defines: knife/blade/single-edged sword/cutlass/CL:把[ba3]/(slang) dollar (loanword)/classifier
      for sets of one hundred sheets (of paper)/classifier for knife cuts or stabs
    tier: 0
    label: 刀
  牛:
    symbol: niu2
    defines: ox/cow/bull/CL:條|条[tiao2],頭|头[tou2]/newton (abbr. for 牛頓|牛顿[niu2 dun4])/(slang)
      awesome
    tier: 0
    label: 牛
  角:
    symbol: jue2 / jiao3
    defines: angle/corner/horn/horn-shaped/unit of money equal to 0.1 yuan, or 10
      cents (a dime)/CL:個|个[ge4] / role (theater)/to compete/ancient three legged
      wine vessel/third note of pentatonic scale
    tier: 0
    label: 角
  子:
    symbol: zi3
    defines: 'son/child/seed/egg/small thing/1st earthly branch: 11 p.m.-1 a.m., midnight,
      11th solar month (7th December to 5th January), year of the Rat/Viscount, fourth
      of five orders of nobility 五等爵位[wu3 deng3 jue2 wei4]/ancient Chinese compass
      point: 0° (north)/subsidiary/subordinate/sub-'
    tier: 0
    label: 子
  宀:
    symbol: mian2
    defines: '"""roof"" radical (Kangxi radical 40), occurring in 家, 定, 安 etc, referred
      to as 寶蓋|宝盖[bao3 gai4]"'
    tier: 0
    label: 宀
