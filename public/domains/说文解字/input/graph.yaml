    - 兑
    - 讠
  兑:
    symbol: dui4
    defines: to cash/to exchange/to add (liquid)/to blend/one of the Eight Trigrams
      八卦[ba1 gua4], symbolizing swamp/☱
    tier: 1
    label: 兑
    composed_of:
    - 丷
    - 兄
  兄:
    symbol: xiong1
    defines: elder brother
    tier: 1
    label: 兄
    composed_of:
    - 儿
    - 口
  文:
    symbol: wen2
    defines: language/culture/writing/formal/literary/gentle/(old) classifier for
      coins/Kangxi radical 67
    tier: 1
    label: 文
    composed_of:
    - 乂
    - 亠
  乂:
    symbol: yi4
    defines: to regulate/to govern/to control/to mow
    tier: 1
    label: 乂
    composed_of:
    - 丿
    - 乀
  解:
    symbol: xie4 / jie4 / jie3
    defines: acrobatic display (esp. on horseback) (old)/variant of 懈[xie4] and 邂[xie4]
